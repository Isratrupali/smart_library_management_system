<!DOCTYPE html>
<!-- FILE: frontend/student/catalog.html - Book catalog search and browse page -->
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Catalog — SmartLibrary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="sidebar">
  <div class="sidebar-brand"><a class="navbar-brand" href="/" style="font-size:1.1rem;">📚 SmartLibrary</a><div class="mt-2"><span class="role-badge role-student">Student</span></div></div>
  <a href="/student/dashboard.html"  class="sidebar-nav-item"><span class="sidebar-icon">🏠</span> Dashboard</a>
  <a href="/student/catalog.html"    class="sidebar-nav-item active"><span class="sidebar-icon">📚</span> Book Catalog</a>
  <a href="/student/ebooks.html"     class="sidebar-nav-item"><span class="sidebar-icon">📖</span> E-books & Audio</a>
  <a href="/student/membership.html" class="sidebar-nav-item"><span class="sidebar-icon">⭐</span> Membership</a>
  <a href="/student/billing.html"    class="sidebar-nav-item"><span class="sidebar-icon">💳</span> Billing</a>
  <a href="/student/seats.html"      class="sidebar-nav-item"><span class="sidebar-icon">💺</span> Seat Booking</a>
  <div style="position:absolute;bottom:1.5rem;left:0;right:0;padding:0 1rem;">
    <button onclick="logout()" class="btn-outline-glass w-100" style="font-size:0.85rem;">🚪 Logout</button>
  </div>
</div>
<div class="main-with-sidebar">
  <div class="page-header page-header-student rounded-3 px-4 mb-4">
    <h2 class="font-display fw-800 mb-0">📚 Book Catalog</h2>
    <p class="text-muted-custom mb-0 mt-1">Search, filter, and borrow from our collection</p>
  </div>

  <!-- SEARCH AND FILTER BAR: Uses Decorator + Strategy patterns on backend -->
  <div class="glass-card p-3 mb-4">
    <div class="row g-2">
      <!-- Keyword search: maps to KeywordFilter (Decorator Pattern) -->
      <div class="col-md-4">
        <input type="text" id="search-keyword" class="form-control" placeholder="🔍 Search title, author, ISBN...">
      </div>
      <!-- Genre filter: maps to GenreFilter (Decorator Pattern) -->
      <div class="col-md-2">
        <select id="search-genre" class="form-select">
          <option value="">All Genres</option>
          <option>Computer Science</option><option>Mathematics</option>
          <option>Physics</option><option>Literature</option>
          <option>Self-Help</option><option>Biology</option>
        </select>
      </div>
      <!-- Book type filter: maps to TypeFilter (Decorator Pattern) -->
      <div class="col-md-2">
        <select id="search-type" class="form-select">
          <option value="">All Types</option>
          <option value="physical">📖 Physical</option>
          <option value="ebook">💻 E-book</option>
          <option value="audio">🎧 Audio</option>
        </select>
      </div>
      <!-- Sort order: maps to Strategy Pattern on backend -->
      <div class="col-md-2">
        <select id="search-sort" class="form-select">
          <option value="title">Sort: Title</option>
          <option value="author">Sort: Author</option>
          <option value="year">Sort: Newest</option>
          <option value="popular">Sort: Popular</option>
        </select>
      </div>
      <!-- Available only toggle -->
      <div class="col-md-1">
        <div class="form-check mt-2">
          <input class="form-check-input" type="checkbox" id="search-available">
          <label class="form-check-label text-muted-custom" style="font-size:0.8rem;">Available</label>
        </div>
      </div>
      <!-- Search button -->
      <div class="col-md-1">
        <button onclick="searchBooks()" class="btn-primary-gradient w-100" style="border:none;padding:0.5rem;">Search</button>
      </div>
    </div>
  </div>

  <!-- Results count and book grid -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div class="text-muted-custom" id="results-count" style="font-size:0.875rem;"></div>
  </div>
  <!-- Book cards grid: populated by JavaScript searchBooks() -->
  <div class="row g-3" id="books-grid"><div class="col-12 text-center py-4"><div class="spinner"></div></div></div>
</div>

<!-- BOOK DETAIL MODAL: Shown when user clicks a book card -->
<div class="modal-overlay" id="book-modal">
  <div class="modal-box">
    <div id="modal-content">Loading...</div>
    <div class="mt-3 d-flex gap-2">
      <button id="modal-borrow-btn" onclick="borrowBook()" class="btn-primary-gradient" style="border:none;display:none;">📚 Borrow</button>
      <button id="modal-waitlist-btn" onclick="joinWaitlist()" class="btn-sm-action btn-sm-amber" style="display:none;">⏳ Join Waitlist</button>
      <button onclick="closeModal()" class="btn-outline-glass" style="margin-left:auto;">Close</button>
    </div>
    <div id="modal-msg" class="mt-2" style="display:none;"></div>
  </div>
</div>

<div class="toast-container-custom" id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/student.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    checkAuth('student'); // Verify student session
    searchBooks();        // Load all books on page load
    // Also search on Enter key press in the keyword field
    document.getElementById('search-keyword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchBooks();
    });
  });
</script>
</body>
</html>
