<!DOCTYPE html>
<!-- FILE: frontend/student/seats.html - Seat booking page for reading rooms -->
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seat Booking — SmartLibrary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="sidebar">
  <div class="sidebar-brand"><a class="navbar-brand" href="/" style="font-size:1.1rem;">📚 SmartLibrary</a><div class="mt-2"><span class="role-badge role-student">Student</span></div></div>
  <a href="/student/dashboard.html"  class="sidebar-nav-item"><span class="sidebar-icon">🏠</span> Dashboard</a>
  <a href="/student/catalog.html"    class="sidebar-nav-item"><span class="sidebar-icon">📚</span> Book Catalog</a>
  <a href="/student/ebooks.html"     class="sidebar-nav-item"><span class="sidebar-icon">📖</span> E-books & Audio</a>
  <a href="/student/membership.html" class="sidebar-nav-item"><span class="sidebar-icon">⭐</span> Membership</a>
  <a href="/student/billing.html"    class="sidebar-nav-item"><span class="sidebar-icon">💳</span> Billing</a>
  <a href="/student/seats.html"      class="sidebar-nav-item active"><span class="sidebar-icon">💺</span> Seat Booking</a>
  <div style="position:absolute;bottom:1.5rem;left:0;right:0;padding:0 1rem;">
    <button onclick="logout()" class="btn-outline-glass w-100" style="font-size:0.85rem;">🚪 Logout</button>
  </div>
</div>
<div class="main-with-sidebar">
  <div class="page-header page-header-student rounded-3 px-4 mb-4">
    <h2 class="font-display fw-800 mb-0">💺 Seat Booking</h2>
    <p class="text-muted-custom mb-0 mt-1">Reserve your reading room seat</p>
  </div>

  <div class="row g-4">
    <!-- Booking form: left side -->
    <div class="col-md-5">
      <div class="glass-card p-4">
        <h5 class="font-display fw-800 mb-4 text-cyan">Book a Seat</h5>
        <!-- Date picker -->
        <div class="mb-3">
          <label class="form-label">Date</label>
          <input type="date" id="seat-date" class="form-control" min="" onchange="loadSeats()">
        </div>
        <!-- Time slot selection -->
        <div class="mb-3">
          <label class="form-label">Time Slot</label>
          <select id="seat-timeslot" class="form-select" onchange="loadSeats()">
            <option value="09:00-11:00">09:00 – 11:00</option>
            <option value="11:00-13:00">11:00 – 13:00</option>
            <option value="13:00-15:00">13:00 – 15:00</option>
            <option value="15:00-17:00">15:00 – 17:00</option>
            <option value="17:00-19:00">17:00 – 19:00</option>
          </select>
        </div>
        <!-- Room selection -->
        <div class="mb-3">
          <label class="form-label">Room</label>
          <select id="seat-room" class="form-select" onchange="loadSeats()">
            <option>Reading Room A</option>
            <option>Reading Room B</option>
          </select>
        </div>
        <!-- Seat number grid: A1-A5, B1-B5 -->
        <div class="mb-4">
          <label class="form-label">Select Seat</label>
          <div class="d-flex flex-wrap gap-2" id="seat-grid">
            <!-- Seat buttons generated by JS: green=available, red=taken -->
          </div>
        </div>
        <!-- Hidden field: stores the selected seat number -->
        <input type="hidden" id="selected-seat" value="">
        <button onclick="bookSeat()" class="btn-primary-gradient w-100" style="border:none;">✅ Confirm Booking</button>
        <div id="seat-msg" class="mt-3" style="display:none;"></div>
      </div>
    </div>

    <!-- My bookings list: right side -->
    <div class="col-md-7">
      <div class="glass-card p-4 h-100">
        <h5 class="font-display fw-800 mb-4">📅 My Bookings</h5>
        <div id="my-bookings-list"><div class="spinner"></div></div>
      </div>
    </div>
  </div>
</div>

<div class="toast-container-custom" id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/student.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    checkAuth('student');      // Verify login
    // Set minimum date to today
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('seat-date').min   = today;
    document.getElementById('seat-date').value = today; // Default to today
    loadSeats();               // Load seat availability
  });
</script>
</body>
</html>
