<!DOCTYPE html>
<!-- FILE: frontend/auth.html - Login and Registration page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — SmartLibrary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;">

<!-- CENTERED AUTH CARD: fills the screen center -->
<div style="width:100%;max-width:440px;padding:1rem;">

  <!-- Brand header above the card -->
  <div class="text-center mb-4">
    <a href="/" class="navbar-brand" style="font-size:1.6rem;">📚 SmartLibrary</a>
    <p class="text-muted-custom mt-1" style="font-size:0.85rem;">CSE327 — Smart Library Management System</p>
  </div>

  <!-- Auth card: contains Login + Register tabs -->
  <div class="glass-card p-4">

    <!-- Tab buttons: toggle between Login and Register forms -->
    <div class="d-flex mb-4" style="background:#f1f5f9;border-radius:10px;padding:4px;border:1px solid rgba(37,99,235,0.12);">
      <!-- Login tab button — active by default -->
      <button id="tab-login" onclick="switchTab('login')"
        style="flex:1;padding:0.6rem;border:none;border-radius:8px;font-weight:600;font-size:0.875rem;cursor:pointer;transition:all 0.2s;background:linear-gradient(135deg,#2563eb,#16a34a);color:white;">
        Login
      </button>
      <!-- Register tab button — inactive by default -->
      <button id="tab-register" onclick="switchTab('register')"
        style="flex:1;padding:0.6rem;border:none;border-radius:8px;font-weight:600;font-size:0.875rem;cursor:pointer;transition:all 0.2s;background:transparent;color:#64748b;">
        Register
      </button>
    </div>

    <!-- LOGIN FORM: shown by default -->
    <div id="form-login">
      <h5 class="font-display fw-800 mb-4">Welcome Back 👋</h5>

      <!-- Email input field -->
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" id="login-email" class="form-control" placeholder="alice@student.edu">
      </div>

      <!-- Password input field -->
      <div class="mb-4">
        <label class="form-label">Password</label>
        <input type="password" id="login-password" class="form-control" placeholder="Enter your password">
      </div>

      <!-- Submit button: calls loginUser() on click -->
      <button onclick="loginUser()" class="btn-primary-gradient w-100" style="border:none;width:100%;">
        🔐 Login
      </button>

      <!-- Error/success message area: hidden until needed -->
      <div id="login-msg" class="mt-3" style="display:none;"></div>

      <!-- Demo credentials for easy testing -->
      <div class="mt-4 p-3" style="background:#f8fafc;border-radius:10px;border:1px solid rgba(37,99,235,0.12);">
        <div class="text-muted-custom" style="font-size:0.75rem;font-weight:600;margin-bottom:0.5rem;">DEMO ACCOUNTS</div>
        <!-- Clickable quick-fill buttons for each demo account -->
        <div class="d-flex flex-column gap-1">
          <button onclick="fillDemo('alice@student.edu')" style="background:#dbeafe;border:1px solid rgba(37,99,235,0.35);color:#1d4ed8;border-radius:6px;padding:4px 10px;font-size:0.72rem;cursor:pointer;text-align:left;">🎓 alice@student.edu / password123</button>
          <button onclick="fillDemo('sarah@library.edu')" style="background:#ffedd5;border:1px solid rgba(234,88,12,0.35);color:#c2410c;border-radius:6px;padding:4px 10px;font-size:0.72rem;cursor:pointer;text-align:left;">📋 sarah@library.edu / password123</button>
          <button onclick="fillDemo('admin@library.edu')" style="background:#dcfce7;border:1px solid rgba(22,163,74,0.35);color:#166534;border-radius:6px;padding:4px 10px;font-size:0.72rem;cursor:pointer;text-align:left;">👑 admin@library.edu / password123</button>
        </div>
      </div>
    </div>

    <!-- REGISTER FORM: hidden by default, shown when Register tab clicked -->
    <div id="form-register" style="display:none;">
      <h5 class="font-display fw-800 mb-4">Create Account 🚀</h5>

      <!-- Full name input -->
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" id="reg-name" class="form-control" placeholder="Your full name">
      </div>

      <!-- Email input -->
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" id="reg-email" class="form-control" placeholder="you@example.com">
      </div>

      <!-- Password input -->
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters">
      </div>

      <!-- Confirm password input -->
      <div class="mb-4">
        <label class="form-label">Confirm Password</label>
        <input type="password" id="reg-confirm" class="form-control" placeholder="Repeat your password">
      </div>

      <!-- Register submit button -->
      <button onclick="registerUser()" class="btn-primary-gradient w-100" style="border:none;width:100%;">
        ✅ Create Account
      </button>

      <!-- Message area for register response -->
      <div id="register-msg" class="mt-3" style="display:none;"></div>

      <!-- Note: new accounts are always student role -->
      <p class="text-muted-custom mt-3" style="font-size:0.75rem;text-align:center;">
        New accounts are created as Student role. Contact admin to change role.
      </p>
    </div>

  </div><!-- /glass-card -->

  <!-- Back to homepage link -->
  <div class="text-center mt-3">
    <a href="/" style="color:#475569;font-size:0.8rem;">← Back to Home</a>
  </div>

</div><!-- /container -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Auth JavaScript: handles login/register logic -->
<script src="/js/auth.js"></script>
</body>
</html>
