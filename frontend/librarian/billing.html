<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Membership billing — SmartLibrary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="sidebar">
  <div class="sidebar-brand"><a class="navbar-brand" href="/" style="font-size:1.1rem;">📚 SmartLibrary</a><div class="mt-2"><span class="role-badge role-librarian">Librarian</span></div></div>
  <a href="/librarian/dashboard.html"    class="sidebar-nav-item"><span class="sidebar-icon">🏠</span> Dashboard</a>
  <a href="/librarian/billing.html"      class="sidebar-nav-item active"><span class="sidebar-icon">💳</span> Billing</a>
  <a href="/librarian/manage-books.html" class="sidebar-nav-item"><span class="sidebar-icon">📚</span> Manage Books</a>
  <a href="/librarian/borrowing.html"    class="sidebar-nav-item"><span class="sidebar-icon">🔄</span> Borrowing</a>
  <a href="/librarian/seats.html"        class="sidebar-nav-item"><span class="sidebar-icon">💺</span> Seats</a>
  <a href="/librarian/students.html"     class="sidebar-nav-item"><span class="sidebar-icon">👥</span> Students</a>
  <a href="/librarian/notifications.html"class="sidebar-nav-item"><span class="sidebar-icon">🔔</span> Notifications</a>
  <div style="position:absolute;bottom:1.5rem;left:0;right:0;padding:0 1rem;">
    <button onclick="logout()" class="btn-outline-glass w-100" style="font-size:0.85rem;">🚪 Logout</button>
  </div>
</div>
<div class="main-with-sidebar">
  <div class="page-header page-header-librarian rounded-3 px-4 mb-4">
    <h2 class="font-display fw-800 mb-0 text-amber">💳 Membership billing</h2>
    <p class="text-muted-custom mb-0 mt-1">Track unpaid membership invoices, record payments, send reminders</p>
  </div>
  <div class="d-flex flex-wrap gap-2 mb-3 align-items-center">
    <label class="text-muted-custom mb-0" style="font-size:0.875rem;">Show:</label>
    <select id="billing-filter" class="form-select" style="max-width:180px;" onchange="loadBillingInvoices()">
      <option value="all">All</option>
      <option value="pending" selected>Pending only</option>
      <option value="paid">Paid only</option>
    </select>
  </div>
  <div class="glass-card p-4">
    <div id="lib-billing-loading" class="spinner"></div>
    <div class="table-responsive" id="lib-billing-table-wrap" style="display:none;">
      <table class="table-dark-custom">
        <thead><tr><th>ID</th><th>Student</th><th>Email</th><th>Tier</th><th>Amount</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead>
        <tbody id="lib-billing-body"></tbody>
      </table>
    </div>
    <p id="lib-billing-empty" class="text-muted-custom py-4 text-center" style="display:none;">No invoices for this filter.</p>
  </div>
</div>
<div class="toast-container-custom" id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/librarian.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => { checkLibrarian(); loadBillingInvoices(); });</script>
</body>
</html>
