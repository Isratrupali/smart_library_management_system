<!DOCTYPE html>
<!-- FILE: frontend/librarian/borrowing.html - Monitor all active loans -->
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Borrowing — SmartLibrary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="sidebar">
  <div class="sidebar-brand"><a class="navbar-brand" href="/" style="font-size:1.1rem;">📚 SmartLibrary</a><div class="mt-2"><span class="role-badge role-librarian">Librarian</span></div></div>
  <a href="/librarian/dashboard.html"    class="sidebar-nav-item"><span class="sidebar-icon">🏠</span> Dashboard</a>
  <a href="/librarian/billing.html"      class="sidebar-nav-item"><span class="sidebar-icon">💳</span> Billing</a>
  <a href="/librarian/manage-books.html" class="sidebar-nav-item"><span class="sidebar-icon">📚</span> Manage Books</a>
  <a href="/librarian/borrowing.html"    class="sidebar-nav-item active"><span class="sidebar-icon">🔄</span> Borrowing</a>
  <a href="/librarian/seats.html"        class="sidebar-nav-item"><span class="sidebar-icon">💺</span> Seats</a>
  <a href="/librarian/students.html"     class="sidebar-nav-item"><span class="sidebar-icon">👥</span> Students</a>
  <a href="/librarian/notifications.html"class="sidebar-nav-item"><span class="sidebar-icon">🔔</span> Notifications</a>
  <div style="position:absolute;bottom:1.5rem;left:0;right:0;padding:0 1rem;">
    <button onclick="logout()" class="btn-outline-glass w-100" style="font-size:0.85rem;">🚪 Logout</button>
  </div>
</div>
<div class="main-with-sidebar">
  <div class="page-header page-header-librarian rounded-3 px-4 mb-4">
    <h2 class="font-display fw-800 mb-0 text-amber">🔄 Active Borrowing Records</h2>
    <p class="text-muted-custom mb-0 mt-1">All currently borrowed books — click Return to process a return</p>
  </div>
  <div class="glass-card p-4">
    <div id="borrows-loading" class="spinner"></div>
    <div style="overflow-x:auto;">
      <table class="table-dark-custom w-100" id="borrows-table" style="display:none;">
        <thead><tr>
          <th>Student</th><th>Email</th><th>Book</th><th>Borrowed</th><th>Due Date</th><th>Status</th><th>Fine</th><th>Action</th>
        </tr></thead>
        <tbody id="borrows-body"></tbody>
      </table>
    </div>
  </div>
</div>
<div class="toast-container-custom" id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/librarian.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => { checkLibrarian(); loadAllBorrows(); });</script>
</body>
</html>
