<!DOCTYPE html>
<!-- FILE: frontend/admin/statistics.html - Charts and analytics -->
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Statistics — SmartLibrary Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <!-- Chart.js for rendering charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-brand"><a class="navbar-brand" href="/" style="font-size:1.1rem;">📚 SmartLibrary</a><div class="mt-2"><span class="role-badge role-admin">Admin</span></div></div>
  <a href="/admin/dashboard.html"  class="sidebar-nav-item"><span class="sidebar-icon">🏠</span> Dashboard</a>
  <a href="/admin/users.html"      class="sidebar-nav-item"><span class="sidebar-icon">👥</span> Users</a>
  <a href="/admin/membership.html" class="sidebar-nav-item"><span class="sidebar-icon">⭐</span> Membership</a>
  <a href="/admin/billing.html" class="sidebar-nav-item"><span class="sidebar-icon">💳</span> Billing</a>
  <a href="/admin/statistics.html" class="sidebar-nav-item active"><span class="sidebar-icon">📊</span> Statistics</a>
  <a href="/admin/settings.html"   class="sidebar-nav-item"><span class="sidebar-icon">⚙️</span> Settings</a>
  <div style="position:absolute;bottom:1.5rem;left:0;right:0;padding:0 1rem;">
    <button onclick="logout()" class="btn-outline-glass w-100" style="font-size:0.85rem;">🚪 Logout</button>
  </div>
</div>
<div class="main-with-sidebar">
  <div class="page-header page-header-admin rounded-3 px-4 mb-4">
    <h2 class="font-display fw-800 mb-0 text-purple">📊 System Statistics</h2>
    <p class="text-muted-custom mb-0 mt-1">Visual analytics of library activity</p>
  </div>

  <!-- Charts row -->
  <div class="row g-4 mb-4">
    <!-- Loan status doughnut chart -->
    <div class="col-md-5">
      <div class="glass-card p-4 h-100">
        <h6 class="font-display fw-800 mb-3 text-purple">Loan Status Distribution</h6>
        <canvas id="loanChart" width="300" height="300"></canvas>
      </div>
    </div>
    <!-- User role distribution chart -->
    <div class="col-md-7">
      <div class="glass-card p-4 h-100">
        <h6 class="font-display fw-800 mb-3 text-purple">User Distribution by Role</h6>
        <canvas id="userChart" width="400" height="300"></canvas>
      </div>
    </div>
  </div>

  <!-- Summary stat cards under the charts -->
  <div class="row g-3">
    <div class="col-md-3"><div class="glass-card glass-card-cyan p-3 text-center stat-card"><div class="stat-icon">📚</div><div class="stat-value text-cyan" id="s-books">—</div><div class="stat-label">Total Books</div></div></div>
    <div class="col-md-3"><div class="glass-card p-3 text-center stat-card"><div class="stat-icon">👥</div><div class="stat-value" id="s-users">—</div><div class="stat-label">Total Users</div></div></div>
    <div class="col-md-3"><div class="glass-card glass-card-amber p-3 text-center stat-card"><div class="stat-icon">💰</div><div class="stat-value text-amber" id="s-fines">—</div><div class="stat-label">Fines (BDT)</div></div></div>
    <div class="col-md-3"><div class="glass-card glass-card-red p-3 text-center stat-card"><div class="stat-icon">⚠️</div><div class="stat-value text-red" id="s-overdue">—</div><div class="stat-label">Overdue</div></div></div>
  </div>
</div>

<div class="toast-container-custom" id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/admin.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => { checkAdmin(); loadStats(); });</script>
</body>
</html>
