<!DOCTYPE html>
<!-- FILE: frontend/admin/users.html - Manage all system users -->
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users — SmartLibrary Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="sidebar">
  <div class="sidebar-brand"><a class="navbar-brand" href="/" style="font-size:1.1rem;">📚 SmartLibrary</a><div class="mt-2"><span class="role-badge role-admin">Admin</span></div></div>
  <a href="/admin/dashboard.html"  class="sidebar-nav-item"><span class="sidebar-icon">🏠</span> Dashboard</a>
  <a href="/admin/users.html"      class="sidebar-nav-item active"><span class="sidebar-icon">👥</span> Users</a>
  <a href="/admin/membership.html" class="sidebar-nav-item"><span class="sidebar-icon">⭐</span> Membership</a>
  <a href="/admin/billing.html" class="sidebar-nav-item"><span class="sidebar-icon">💳</span> Billing</a>
  <a href="/admin/statistics.html" class="sidebar-nav-item"><span class="sidebar-icon">📊</span> Statistics</a>
  <a href="/admin/settings.html"   class="sidebar-nav-item"><span class="sidebar-icon">⚙️</span> Settings</a>
  <div style="position:absolute;bottom:1.5rem;left:0;right:0;padding:0 1rem;">
    <button onclick="logout()" class="btn-outline-glass w-100" style="font-size:0.85rem;">🚪 Logout</button>
  </div>
</div>
<div class="main-with-sidebar">
  <div class="page-header page-header-admin rounded-3 px-4 mb-4 d-flex justify-content-between align-items-center">
    <div><h2 class="font-display fw-800 mb-0 text-purple">👥 User Management</h2><p class="text-muted-custom mb-0 mt-1">Create, edit, suspend all user accounts</p></div>
    <button onclick="openAddUserModal()" class="btn-primary-gradient" style="border:none;">+ Add User</button>
  </div>

  <!-- Filter row -->
  <div class="glass-card p-3 mb-4">
    <div class="row g-2">
      <div class="col-md-5"><input type="text" id="user-search" class="form-control" placeholder="🔍 Search name or email..." oninput="filterUsers()"></div>
      <div class="col-md-3">
        <select id="user-role-filter" class="form-select" onchange="loadAdminUsers()">
          <option value="">All Roles</option>
          <option value="student">Students</option>
          <option value="librarian">Librarians</option>
          <option value="admin">Admins</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Users table -->
  <div class="glass-card p-4">
    <div id="users-loading" class="spinner"></div>
    <div style="overflow-x:auto;">
      <table class="table-dark-custom w-100" id="users-table" style="display:none;">
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Membership</th><th>Fine</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="users-body"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ADD USER MODAL -->
<div class="modal-overlay" id="add-user-modal">
  <div class="modal-box">
    <h5 class="font-display fw-800 mb-4">Add New User</h5>
    <div class="mb-3"><label class="form-label">Full Name</label><input id="au-name" class="form-control" placeholder="Full name"></div>
    <div class="mb-3"><label class="form-label">Email</label><input id="au-email" class="form-control" placeholder="email@example.com"></div>
    <div class="mb-3"><label class="form-label">Password</label><input id="au-password" type="password" class="form-control" placeholder="Min 6 characters"></div>
    <div class="mb-4">
      <label class="form-label">Role</label>
      <!-- Factory Pattern: role selected here determines which UserFactory subclass is used -->
      <select id="au-role" class="form-select">
        <option value="student">🎓 Student</option>
        <option value="librarian">📋 Librarian</option>
        <option value="admin">⚙️ Admin</option>
      </select>
    </div>
    <div class="d-flex gap-2 justify-content-end">
      <button onclick="closeAddUserModal()" class="btn-outline-glass">Cancel</button>
      <button onclick="createUser()" class="btn-primary-gradient" style="border:none;">✅ Create User</button>
    </div>
    <div id="au-msg" class="mt-3" style="display:none;"></div>
  </div>
</div>

<!-- EDIT USER MODAL -->
<div class="modal-overlay" id="edit-user-modal">
  <div class="modal-box">
    <h5 class="font-display fw-800 mb-4">Edit User</h5>
    <input type="hidden" id="eu-id">
    <div class="mb-3"><label class="form-label">Role</label>
      <select id="eu-role" class="form-select">
        <option value="student">🎓 Student</option>
        <option value="librarian">📋 Librarian</option>
        <option value="admin">⚙️ Admin</option>
      </select>
    </div>
    <div class="mb-3"><label class="form-label">Membership</label>
      <select id="eu-membership" class="form-select">
        <option value="basic">Basic</option>
        <option value="premium">Premium</option>
        <option value="gold">Gold</option>
      </select>
    </div>
    <div class="mb-3"><label class="form-label">Fine Balance (BDT)</label><input id="eu-fine" type="number" class="form-control" min="0" value="0"></div>
    <div class="mb-4 d-flex align-items-center gap-2">
      <input type="checkbox" id="eu-suspended" style="width:18px;height:18px;">
      <label class="form-label mb-0">Suspend Account</label>
    </div>
    <div class="d-flex gap-2 justify-content-end">
      <button onclick="closeEditUserModal()" class="btn-outline-glass">Cancel</button>
      <button onclick="saveUserEdit()" class="btn-primary-gradient" style="border:none;">💾 Save Changes</button>
    </div>
    <div id="eu-msg" class="mt-3" style="display:none;"></div>
  </div>
</div>

<div class="toast-container-custom" id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/admin.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => { checkAdmin(); loadAdminUsers(); });</script>
</body>
</html>
